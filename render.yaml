# Render Deployment Configuration
services:
  - type: web
    name: gnm-group-attendance
    env: node
    plan: starter
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        fromDatabase:
          name: gnm-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true